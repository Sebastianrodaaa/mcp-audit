name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: static eval reproduces the README numbers
        run: python eval/run_eval.py --out /tmp/metrics.json
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          target: examples/poisoned-inventory.json
          upload-sarif: "false"
      - name: the poisoned demo inventory must fail the scan
        run: test "${{ steps.audit.outcome }}" = "failure"
