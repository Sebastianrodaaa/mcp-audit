name: mcp-audit
description: Scan MCP server configs for tool poisoning and rug-pulls, and upload the findings to GitHub code scanning.
author: Sebastian Roda
branding:
  icon: shield
  color: red
inputs:
  target:
    description: MCP client config or saved tools/list JSON to scan (e.g. .cursor/mcp.json, .vscode/mcp.json, mcp.json)
    required: false
    default: mcp.json
  lockfile:
    description: Lockfile of pinned definition hashes. Changes against it are reported as rug-pulls (MA012).
    required: false
    default: mcp-audit.lock
  fail-on:
    description: Fail the job at or above this severity (info, low, medium, high, critical, never)
    required: false
    default: high
  min-severity:
    description: Hide findings below this severity
    required: false
    default: low
  upload-sarif:
    description: Upload the SARIF report to code scanning
    required: false
    default: "true"
  args:
    description: Extra arguments for `mcp-audit scan`
    required: false
    default: ""
outputs:
  sarif:
    description: Path to the SARIF report
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - id: scan
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        LOCKFILE: ${{ inputs.lockfile }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        EXTRA: ${{ inputs.args }}
      run: |
        set +e
        lock=()
        [ -f "$LOCKFILE" ] && lock=(--lock "$LOCKFILE")
        mcp-audit scan "$TARGET" "${lock[@]}" --format sarif -o mcp-audit.sarif --artifact "$TARGET" \
          --min-severity "$MIN_SEVERITY" --fail-on "$FAIL_ON" $EXTRA
        code=$?
        echo "sarif=mcp-audit.sarif" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        mcp-audit scan "$TARGET" "${lock[@]}" --format markdown --fail-on never --min-severity "$MIN_SEVERITY" $EXTRA >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
    - if: inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: mcp-audit.sarif
        category: mcp-audit
    - if: steps.scan.outputs.code != '0'
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.code }}" = "1" ]; then
          echo "::error::mcp-audit found issues at or above '${{ inputs.fail-on }}'"
        else
          echo "::error::mcp-audit exited with code ${{ steps.scan.outputs.code }} (server unreachable with --strict, or a scan error)"
        fi
        exit 1
